<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Run 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080f; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
(function () {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");

  // ---------- Settings you can tweak ----------
  const W = 960, H = 540;
  const HZ = 200;                  // horizon row on screen
  const K = 68000, CAMH = 819;     // perspective constants (row p below horizon = K / distance)
  const ZP = 252;                  // how far ahead of the camera the player car sits
  const RW = 1000;                 // road half width (world units)
  const LANES = [-667, 0, 667];
  const PWW = 400;                 // player car width (world units)
  const MIN_SPEED = 1500, MAX_SPEED = 4200, CRUISE = 2400;
  const START_LIVES = 3;
  const FUEL_DRAIN = 3.5;          // fuel lost per second
  const NEAR_GAP = 180;            // world units: how close counts as a near miss
  const NEAR_FUEL = 14;            // fuel gained per near miss
  const COLORS = ["#4cc9f0", "#f4d35e", "#8ac926", "#b5179e", "#ff9f1c", "#e5e5e5"];

  // The road bends left and right. This function says how far the road centre is shifted.
  const off = function (z) { return 1100 * Math.sin(z * 0.00035) + 500 * Math.sin(z * 0.0009 + 1.3); };

  // ---------- Game state ----------
  const keys = {};
  let state = "menu";              // "menu" | "play" | "over"
  let best = 0, clock = 0, shake = 0, overAt = 0, bgScroll = 0;
  let xp, objs, popups, score, fuel, lives, speed, dist, t, spawnT, inv, reason;

  function reset() {
    xp = 0; objs = []; popups = [];
    score = 0; fuel = 100; lives = START_LIVES;
    speed = CRUISE; dist = 0; t = 0; spawnT = 0.8; inv = 0; reason = "";
  }
  reset();

  // ---------- Input ----------
  addEventListener("keydown", function (e) {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(e.key) >= 0) e.preventDefault();
    keys[e.key] = true;
    if ((e.key === "Enter" || e.key === " ") && state !== "play") {
      if (state === "over" && Date.now() - overAt < 600) return;
      reset(); state = "play";
    }
  });
  addEventListener("keyup", function (e) { keys[e.key] = false; });
  addEventListener("blur", function () { for (const k in keys) keys[k] = false; });

  // ---------- Traffic ----------
  function spawn() {
    const z = dist + 7000;
    const taken = {};
    for (const o of objs) if (Math.abs(o.z - z) < 1300) taken[o.lane] = true;
    if (Object.keys(taken).length >= 2) return;           // never block the whole road
    let lane;
    do { lane = (Math.random() * 3) | 0; } while (taken[lane]);
    const x = LANES[lane] + (Math.random() * 180 - 90);
    if (Math.random() < 0.22) objs.push({ lane: lane, x: x, z: z, w: 260, v: 0, rock: true, gap: 9999, done: false });
    else objs.push({ lane: lane, x: x, z: z, w: 400, v: 600 + Math.random() * 500,
                     color: COLORS[(Math.random() * COLORS.length) | 0], gap: 9999, done: false });
  }

  function endGame(why) {
    state = "over"; reason = why; overAt = Date.now();
    best = Math.max(best, score);
  }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    const L = keys.ArrowLeft || keys.a || keys.A;
    const R = keys.ArrowRight || keys.d || keys.D;
    const U = keys.ArrowUp || keys.w || keys.W;
    const D = keys.ArrowDown || keys.s || keys.S;

    if (U) speed += 1400 * dt;
    else if (D) speed -= 2200 * dt;
    else speed += (CRUISE - speed) * 0.8 * dt;
    speed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, speed));

    xp += ((R ? 1 : 0) - (L ? 1 : 0)) * 1500 * dt;
    xp = Math.max(-(RW - 200), Math.min(RW - 200, xp));
    dist += speed * dt;

    fuel -= (FUEL_DRAIN + t * 0.015) * dt;
    if (fuel <= 0) { fuel = 0; endGame("Out of fuel"); return; }

    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      spawnT = Math.max(0.4, 1.2 - t * 0.008) * (CRUISE / speed);
    }
    inv -= dt;

    const pz = dist + ZP;
    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      o.z += o.v * dt;
      const dz = o.z - pz;
      const gap = Math.abs(o.x - xp) - (o.w + PWW) / 2;

      if (Math.abs(dz) < 150 && gap < -8 && inv <= 0) {        // crash
        lives--; inv = 1.6; speed = MIN_SPEED; shake = 0.35;
        popups.push({ txt: "CRASH!", x: W / 2, y: 330, t: 1, color: "#ff5d5d" });
        objs.splice(i, 1);
        if (lives <= 0) { endGame("Out of lives"); return; }
        continue;
      }
      if (Math.abs(dz) < 170 && !o.done) o.gap = Math.min(o.gap, gap);
      if (!o.done && dz < -250) {                              // we have driven past it
        o.done = true;
        if (o.gap >= 0 && o.gap < NEAR_GAP) {
          const pts = 100 + Math.round(((speed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100);
          score += pts; fuel = Math.min(100, fuel + NEAR_FUEL);
          popups.push({ txt: "NEAR MISS +" + pts, x: W / 2, y: 340, t: 1, color: "#7dffb2" });
        }
      }
      if (o.z < dist - 100) objs.splice(i, 1);
    }
  }

  // ---------- Drawing helpers ----------
  const stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * (HZ - 20), r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 });

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function txt(s, x, y, size, color, align, weight) {
    ctx.font = (weight || "600") + " " + size + "px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.fillStyle = color; ctx.textAlign = align || "center"; ctx.fillText(s, x, y);
  }
  function hash(n) { return Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1; }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, HZ);
    g.addColorStop(0, "#050a1c"); g.addColorStop(1, "#10304a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
    for (const s of stars) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 2 + s.p);
      ctx.fillStyle = "#fff"; ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    const bands = [["80,255,170", 0], ["60,220,255", 1], ["180,120,255", 2]];
    for (const b of bands) {
      const rgb = b[0], k = b[1];
      const ag = ctx.createLinearGradient(0, 10, 0, HZ);
      ag.addColorStop(0, "rgba(" + rgb + ",0)");
      ag.addColorStop(0.4, "rgba(" + rgb + ",0.55)");
      ag.addColorStop(1, "rgba(" + rgb + ",0)");
      const f = function (x) { return 40 + k * 16 + Math.sin(x * 0.007 + clock * 0.5 + k * 2) * 20; };
      ctx.fillStyle = ag; ctx.beginPath(); ctx.moveTo(0, f(0));
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, f(x));
      for (let x = W; x >= 0; x -= 12) ctx.lineTo(x, f(x) + 80);
      ctx.closePath(); ctx.fill();
    }
  }

  const LAYERS = [
    { a: 90, b: 35, n1: 3, n2: 7, ph: 1, col: "#1b2a4a", par: 0.5, snow: 95 },
    { a: 70, b: 30, n1: 4, n2: 9, ph: 2, col: "#0c162b", par: 1, snow: 999 }
  ];
  function drawMountains() {
    for (const L of LAYERS) {
      const sc = (bgScroll * L.par) % W;
      for (let x = 0; x < W; x += 4) {
        const xs = (((x - sc) % W) + W) % W, u = (xs / W) * Math.PI;
        const h = L.a * (1 - Math.abs(Math.sin(u * L.n1))) + L.b * (1 - Math.abs(Math.sin(u * L.n2 + L.ph)));
        ctx.fillStyle = L.col; ctx.fillRect(x, HZ - h, 4, h);
        if (h > L.snow) { ctx.fillStyle = "rgba(225,240,255,0.85)"; ctx.fillRect(x, HZ - h, 4, Math.min(h - L.snow, 16)); }
      }
    }
  }

  // The road is drawn one screen row at a time. Rows near the horizon are far away.
  function drawRoad() {
    const ref = off(dist + ZP);
    for (let y = HZ + 1; y < H; y++) {
      const p = y - HZ, z = K / p, zw = dist + z, s = p / CAMH;
      const far = z > 6000;
      const stripe = far ? 0 : Math.floor(zw / 300) & 1;
      const cx = W / 2 + (off(zw) - ref - xp) * s;
      ctx.fillStyle = stripe ? "#0b241f" : "#0e2b24"; ctx.fillRect(0, y, W, 1);
      ctx.fillStyle = stripe ? "#5b6b86" : "#e8eef5";
      ctx.fillRect(cx - (RW + 160) * s, y, 2 * (RW + 160) * s, 1);
      ctx.fillStyle = stripe ? "#2f323d" : "#2b2e38";
      ctx.fillRect(cx - RW * s, y, 2 * RW * s, 1);
      if (!far && (Math.floor(zw / 260) & 1) === 0) {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        const lw = Math.max(1, 22 * s);
        ctx.fillRect(cx - 333 * s - lw / 2, y, lw, 1);
        ctx.fillRect(cx + 333 * s - lw / 2, y, lw, 1);
      }
    }
    const fog = ctx.createLinearGradient(0, HZ, 0, HZ + 70);
    fog.addColorStop(0, "rgba(16,48,74,0.9)"); fog.addColorStop(1, "rgba(16,48,74,0)");
    ctx.fillStyle = fog; ctx.fillRect(0, HZ, W, 70);
  }

  function drawTrees() {
    const ref = off(dist + ZP), base = Math.floor(dist / 450);
    for (let i = 70; i >= 1; i--) {
      const n = base + i, zw = n * 450, zA = zw - dist;
      if (zA < 200) continue;
      const p = K / zA; if (p > H - HZ) continue;
      const s = p / CAMH;
      for (let side = -1; side <= 1; side += 2) {
        const hv = hash(n * side + 7);
        if (hv < 0.3) continue;
        const X = side * (RW + 450 + hv * 900);
        const x = W / 2 + (X - xp + off(zw) - ref) * s;
        if (x < -80 || x > W + 80) continue;
        const by = HZ + p, th = 1100 * s, tw = th * 0.45;
        ctx.fillStyle = "#3a2a1c"; ctx.fillRect(x - tw * 0.06, by - th * 0.15, tw * 0.12, th * 0.15);
        ctx.fillStyle = "#0a3b2c";
        ctx.beginPath(); ctx.moveTo(x, by - th); ctx.lineTo(x - tw / 2, by - th * 0.12); ctx.lineTo(x + tw / 2, by - th * 0.12); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(220,240,255,0.55)";
        ctx.beginPath(); ctx.moveTo(x, by - th); ctx.lineTo(x - tw * 0.2, by - th * 0.7); ctx.lineTo(x + tw * 0.2, by - th * 0.7); ctx.closePath(); ctx.fill();
      }
    }
  }

  // A car seen from behind, w pixels wide, standing on row by.
  function drawCarRear(cx, by, w, color) {
    const h = w * 0.62;
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(cx, by, w * 0.55, h * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#101114";
    ctx.fillRect(cx - w / 2, by - h * 0.3, w * 0.16, h * 0.3); ctx.fillRect(cx + w / 2 - w * 0.16, by - h * 0.3, w * 0.16, h * 0.3);
    ctx.fillStyle = color; rr(cx - w / 2 + w * 0.03, by - h * 0.62, w * 0.94, h * 0.5, w * 0.08); ctx.fill();
    rr(cx - w * 0.36, by - h, w * 0.72, h * 0.5, w * 0.1); ctx.fill();
    ctx.fillStyle = "rgba(10,20,35,0.85)"; rr(cx - w * 0.3, by - h * 0.93, w * 0.6, h * 0.3, w * 0.05); ctx.fill();
    ctx.fillStyle = "#ff2e2e";
    ctx.fillRect(cx - w * 0.46, by - h * 0.52, w * 0.2, h * 0.1); ctx.fillRect(cx + w * 0.26, by - h * 0.52, w * 0.2, h * 0.1);
  }

  function drawRock(cx, by, w) {
    ctx.fillStyle = "#7b8190"; ctx.beginPath(); ctx.ellipse(cx, by - w * 0.22, w / 2, w * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a3a9b7"; ctx.beginPath(); ctx.ellipse(cx - w * 0.1, by - w * 0.3, w * 0.22, w * 0.11, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawObjects() {
    const ref = off(dist + ZP);
    const list = objs.slice().sort(function (a, b) { return b.z - a.z; });
    for (const o of list) {
      const zA = o.z - dist;
      if (zA < 200 || zA > 7500) continue;
      const p = K / zA, s = p / CAMH;
      const x = W / 2 + (o.x - xp + off(o.z) - ref) * s, by = HZ + p;
      if (o.rock) drawRock(x, by, o.w * s); else drawCarRear(x, by, o.w * s, o.color);
    }
  }

  function drawHud() {
    ctx.fillStyle = "rgba(0,0,0,0.38)"; ctx.fillRect(0, 0, W, 72);
    txt("Score " + score, 20, 34, 24, "#ffffff", "left", "700");
    txt("Best " + best, 20, 58, 15, "#b9c6de", "left", "500");
    txt("Fuel", 330, 41, 16, "#b9c6de", "right", "500");
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(344, 28, 240, 16);
    ctx.fillStyle = fuel > 30 ? "#4ade80" : fuel > 15 ? "#fb923c" : "#ef4444";
    ctx.fillRect(344, 28, 2.4 * fuel, 16);
    txt("\u2665".repeat(Math.max(0, lives)), W - 20, 42, 30, "#ff5d6c", "right", "400");
    txt(Math.round(speed / 20) + " km/h", W - 20, H - 18, 22, "#e6eefc", "right", "700");
  }

  function overlay(lines) {
    ctx.fillStyle = "rgba(3,8,20,0.68)"; ctx.fillRect(0, 0, W, H);
    for (const l of lines) txt(l[0], W / 2, l[1], l[2], l[3], "center", l[4]);
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 30 * shake, (Math.random() - 0.5) * 30 * shake);
    drawSky(); drawMountains(); drawRoad(); drawTrees(); drawObjects();
    if (inv <= 0 || Math.floor(clock * 12) % 2) drawCarRear(W / 2, HZ + K / ZP, PWW * (K / ZP) / CAMH, "#e63946");
    for (const p of popups) { ctx.globalAlpha = Math.max(0, p.t); txt(p.txt, p.x, p.y, 28, p.color, "center", "800"); }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (state !== "menu") drawHud();
    const blink = Math.floor(clock * 2) % 2 ? "#ffffff" : "#9fb4d6";
    if (state === "menu") {
      overlay([
        ["AURORA RUN 3D", 170, 56, "#7dffb2", "800"],
        ["Arrow keys: steer, speed up, slow down", 245, 20, "#e6eefc", "500"],
        ["Pass close to cars for near misses", 280, 20, "#e6eefc", "500"],
        ["Near misses give points and refill fuel", 315, 20, "#e6eefc", "500"],
        ["You have 3 lives. Do not run out of fuel.", 350, 20, "#e6eefc", "500"],
        ["Press Enter or Space to start", 430, 24, blink, "700"]
      ]);
    } else if (state === "over") {
      overlay([
        ["GAME OVER", 190, 56, "#ff7b7b", "800"],
        [reason, 235, 22, "#e6eefc", "500"],
        ["Score " + score, 300, 34, "#ffffff", "700"],
        ["Best " + best, 340, 22, "#b9c6de", "500"],
        ["Press Enter or Space to try again", 430, 24, blink, "700"]
      ]);
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; clock += dt;
    shake = Math.max(0, shake - dt);
    if (state === "play") update(dt); else dist += 1500 * dt;
    const sp = state === "play" ? speed : 1500;                // mountains slide as the road bends
    const slope = (off(dist + ZP + 300) - off(dist + ZP)) / 300;
    bgScroll -= slope * sp * dt * 0.05;
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].t -= dt * 0.9; popups[i].y -= 40 * dt;
      if (popups[i].t <= 0) popups.splice(i, 1);
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
